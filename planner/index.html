<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WiiStation 42 planner</title>
<style>
  :root{--bg:#10131a;--panel:#171b25;--line:#252b39;--text:#e6e9ef;--dim:#8d97ab;--accent:#49b0ff;--ok:#49d67a;--warn:#ffb648}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  h1{font-size:16px;margin:0 12px 0 0;letter-spacing:.5px}
  input,select,button{background:#0d1017;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
  #status{margin-left:auto;color:var(--dim)}
  main{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
  .show{border-bottom:1px solid var(--line);padding:6px 0}
  .show:last-child{border-bottom:0}
  .show h3{margin:0;font-size:14px;display:flex;justify-content:space-between;cursor:pointer}
  .show small{color:var(--dim);font-weight:400}
  .eps{display:none;margin:6px 0 2px}
  .show.open .eps{display:block}
  .ep{display:flex;justify-content:space-between;gap:6px;padding:3px 6px;border-radius:5px;cursor:grab}
  .ep:hover{background:#0d1017}
  .ep span{color:var(--dim);font-variant-numeric:tabular-nums}
  .row{display:flex;gap:6px;margin-top:6px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:160px}
  .day h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
  .day.drag{border-color:var(--accent)}
  .item{background:#0d1017;border:1px solid var(--line);border-radius:6px;padding:5px 6px;margin-bottom:5px;font-size:12px;cursor:grab}
  .item b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item i{color:var(--dim);font-style:normal;font-variant-numeric:tabular-nums}
  .item.break{background:#0b0f16;border-style:dashed;opacity:.8}
  .item.break b{font-weight:400;color:var(--dim)}
  .item .x{float:right;color:var(--dim);cursor:pointer;padding:0 3px}
  .item .x:hover{color:#ff7070}
  .fill{color:var(--dim);font-size:12px;text-align:center;padding:6px 0}
  .full{color:var(--ok)}
  .short{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>WiiStation 42</h1>
  <label>Channel <input id="name" value="WiiStation 42" size="16"></label>
  <label>Day starts <input id="dayStart" type="time" value="06:00"></label>
  <label>Slot <select id="slot">
    <option value="0">as it comes</option>
    <option value="1800" selected>30 min</option>
    <option value="3600">60 min</option>
    <option value="900">15 min</option>
  </select></label>
  <label title="short clips from the _breaks folder fill the rest of the slot">
    <input type="checkbox" id="useBreaks" checked> breaks</label>
  <button id="autofill">Fill the week</button>
  <button id="clear">Clear the week</button>
  <button id="stations" title="builds every channel from the files in the stations folder">Build stations</button>
  <button id="guide">Make guide channel</button>
  <button id="save">Save</button>
  <button id="write" class="primary">Write to the card</button>
  <span id="status">loading...</span>
</header>

<main>
  <section class="panel" id="library"><p class="fill">reading your videos...</p></section>
  <section>
    <div class="week" id="week"></div>
  </section>
</main>

<script>
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let shows = [], breaks = [], week = [[],[],[],[],[],[],[]], card = null, drag = null;

const hms = s => s <= 0 ? "0m" : s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s/60)}m` : `${Math.floor(s/3600)}h${String(Math.floor(s%3600/60)).padStart(2,"0")}`;
const clock = s => `${String(Math.floor(s/3600)%24).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}`;
const dayStart = () => { const [h,m] = document.getElementById("dayStart").value.split(":").map(Number); return h*3600+m*60; };
const status = (t, good) => { const s = document.getElementById("status"); s.textContent = t; s.style.color = good ? "var(--ok)" : "var(--dim)"; };

async function load(){
  const lib = await (await fetch("/api/library")).json();
  shows = lib.shows; breaks = lib.breaks || []; card = lib.card;
  const p = await (await fetch("/api/project")).json();
  week = p.week && p.week.length === 7 ? p.week : week;
  document.getElementById("name").value = p.name || "WiiStation 42";
  document.getElementById("dayStart").value = clock(p.dayStart ?? 6*3600);
  drawLibrary(); drawWeek();
  status(card ? "Wii card found: " + card : "no Wii card in the reader", !!card);
}

function drawLibrary(){
  const el = document.getElementById("library");
  el.innerHTML = "";
  for(const s of shows){
    const total = s.items.reduce((a,b)=>a+b.length,0);
    const d = document.createElement("div");
    d.className = "show";
    d.innerHTML = `<h3>${s.show}<small>${s.items.length} &middot; ${hms(total)}</small></h3>
      <div class="row"><button data-add="all">add all</button><button data-add="next">add next</button></div>
      <div class="eps"></div>`;
    const eps = d.querySelector(".eps");
    s.items.forEach((it,i)=>{
      const e = document.createElement("div");
      e.className = "ep"; e.draggable = true;
      e.innerHTML = `<div>${it.name}</div><span>${hms(it.length)}</span>`;
      e.ondragstart = ev => { drag = {from:"lib", item:it}; ev.dataTransfer.effectAllowed = "copy"; };
      e.ondblclick = () => { week[0].push({...it}); drawWeek(); };
      eps.appendChild(e);
    });
    d.querySelector("h3").onclick = () => d.classList.toggle("open");
    d.querySelector('[data-add="all"]').onclick = () => { s.items.forEach(it => withBreak(it).forEach(p => week[0].push(p))); drawWeek(); };
    d.querySelector('[data-add="next"]').onclick = () => { withBreak(s.items[week[0].filter(i=>!i.isBreak).length % s.items.length]).forEach(p => week[0].push(p)); drawWeek(); };
    el.appendChild(d);
  }
}

function drawWeek(){
  const w = document.getElementById("week");
  w.innerHTML = "";
  week.forEach((items, day) => {
    const total = items.reduce((a,b)=>a+b.length,0);
    const brk = items.filter(i=>i.isBreak).reduce((a,b)=>a+b.length,0);
    const col = document.createElement("div");
    col.className = "day";
    col.innerHTML = `<h4>${DAYS[day]}<span class="${total>=86400?"full":"short"}" title="${items.filter(i=>!i.isBreak).length} programmes, ${hms(brk)} of breaks">${hms(total)}</span></h4>`;
    let clockAt = dayStart();
    items.forEach((it, idx) => {
      const el = document.createElement("div");
      el.className = it.isBreak ? "item break" : "item"; el.draggable = true;
      el.innerHTML = `<span class="x">&times;</span><b>${it.name}</b><i>${clock(clockAt)} &middot; ${hms(it.length)}</i>`;
      el.querySelector(".x").onclick = e => { e.stopPropagation(); items.splice(idx,1); drawWeek(); };
      el.ondragstart = ev => { drag = {from:"week", day, idx}; ev.dataTransfer.effectAllowed = "move"; };
      col.appendChild(el);
      clockAt += it.length;
    });
    col.ondragover = ev => { ev.preventDefault(); col.classList.add("drag"); };
    col.ondragleave = () => col.classList.remove("drag");
    col.ondrop = ev => {
      ev.preventDefault(); col.classList.remove("drag");
      if(!drag) return;
      if(drag.from === "lib") withBreak(drag.item).forEach(p => week[day].push(p));
      else { const [it] = week[drag.day].splice(drag.idx,1); week[day].push(it); }
      drag = null; drawWeek();
    };
    w.appendChild(col);
  });
}

// Fills the time between the end of a programme and the next slot with short
// clips, the way a television station fills a break. It stops when the gap is
// smaller than the shortest clip, so it never runs past the slot.
function fillBreak(gap){
  const out = [];
  if(!document.getElementById("useBreaks").checked || !breaks.length) return out;
  const usable = breaks.filter(b => b.length > 2);
  if(!usable.length) return out;
  const shortest = Math.min(...usable.map(b => b.length));
  let left = gap, guard = 40;
  while(left >= shortest && guard-- > 0){
    // take one of the longest clips that still fits, so a break is a few long
    // spots instead of a pile of short ones
    const fits = usable.filter(b => b.length <= left).sort((a,b) => b.length - a.length);
    const pick = fits[Math.floor(Math.random() * Math.min(2, fits.length))];
    out.push({...pick, isBreak:true});
    left -= pick.length;
  }
  return out;
}

function slotSize(){ return parseInt(document.getElementById("slot").value, 10); }

// A programme plus its break, rounded up to whole slots.
function withBreak(item){
  const slot = slotSize();
  if(!slot) return [{...item}];
  const slots = Math.max(1, Math.ceil(item.length / slot));
  return [{...item}, ...fillBreak(slots * slot - item.length)];
}

document.getElementById("autofill").onclick = () => {
  if(!shows.length) return;
  const pos = {}; shows.forEach(s => pos[s.show] = 0);
  let n = 0;
  week = week.map(() => {
    const items = []; let t = 0;
    while(t < 86400){
      const s = shows[n++ % shows.length];
      const it = s.items[pos[s.show]++ % s.items.length];
      for(const part of withBreak(it)){ items.push(part); t += part.length; }
    }
    return items;
  });
  drawWeek(); status("week filled, " + week.flat().length + " programmes");
};

document.getElementById("stations").onclick = async () => {
  status("building the stations...");
  const r = await (await fetch("/api/stations",{method:"POST",body:"{}"})).json();
  const made = (r.built||[]).map(b => `ch${b.channel} ${b.name} (${b.programmes})`).join(", ");
  status(made ? `built: ${made}` + (r.card ? " -> card" : " -> planner folder") : "no station files found", !!made);
};

document.getElementById("guide").onclick = async () => {
  status("drawing the listings and making the videos, this takes a minute...");
  const body = {week, name:document.getElementById("name").value, dayStart:dayStart()};
  const r = await (await fetch("/api/guide",{method:"POST",body:JSON.stringify(body)})).json();
  status(r.lines ? `guide channel ready (${r.lines} lines), videos in ${r.videos}` : "guide failed", !!r.lines);
};

document.getElementById("clear").onclick = () => { week = [[],[],[],[],[],[],[]]; drawWeek(); };

document.getElementById("save").onclick = async () => {
  const body = {week, name:document.getElementById("name").value, dayStart:dayStart()};
  const r = await (await fetch("/api/project",{method:"POST",body:JSON.stringify(body)})).json();
  status("saved: " + r.saved, true);
};

document.getElementById("write").onclick = async () => {
  const start = dayStart();
  const payload = {name:document.getElementById("name").value,
                   week: week.map(items => items.map((it,i) => ({...it, dayStart:start})))};
  const r = await (await fetch("/api/write",{method:"POST",body:JSON.stringify(payload)})).json();
  status(r.card ? `written to the card (${r.written.at(-1).programmes} programmes)` : "no card: written beside the planner only", !!r.card);
};

load();
</script>
</body>
</html>
